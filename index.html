  h+='<div class="cfg"><label>Reps <input class="n" inputmode="numeric" data-rp="'+k+'" value="'+esc(rv)+'"></label><label>Seg. por rep <input class="n" inputmode="numeric" data-sp="'+k+'" value="'+esc(pv)+'"></label></div><button class="clr" data-go="'+id+'" data-k="'+k+'" data-m="'+e[2]+'" data-u="'+u+'">▶ Iniciar série ('+(u?Math.min(2*e[2],sd[0][2]+sd[1][2]+1)+'/'+2*e[2]:(saved>=e[2]?e[2]:saved+1)+'/'+e[2])+')</button>';
  h+='<details><summary>Ver execução e efeito no corpo</summary><div class="pair"><figure>'+svg(p[0])+'<figcaption>'+(p[1]?"Início":"Posição")+'</figcaption></figure>'+(p[1]?'<figure>'+svg(p[1])+'<figcaption>Fim</figcaption></figure>':'')+'</div><p class="cue">'+x[1]+'</p><p class="cue"><b>Efeito no corpo:</b> '+EF[k]+'</p><p class="cue"><a href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(x[0]+' execução correta')+'" target="_blank" rel="noopener">Ver fotos reais</a> · <a href="https://www.youtube.com/results?search_query='+encodeURIComponent(x[0]+' execução correta')+'" target="_blank" rel="noopener">Ver vídeo</a></p></details></section>';
 });
 h+='<button class="clr" data-c="1">Limpar séries de hoje</button>';h+='<div class="note">Progressão: quando fizer todas as séries no topo das repetições, com descida lenta (3 s), passe para a carga seguinte. Pare sempre com 1 a 2 repetições de reserva.</div>';
 return h;
}
function comer(){return '<h2>Metas diárias</h2><ul><li>Proteína: 120 a 160 g por dia, em 30 a 40 g por refeição.</li><li>Calorias: 250 a 300 kcal acima da manutenção.</li><li>Ganho realista: 0,25 a 0,5 kg por mês. Pese-se uma vez por semana.</li></ul><h2>Ao longo do dia</h2><ul><li><b>Antes do treino:</b> banana, pão com açúcar ou mel, ou leite. Se não tiver, manga, papaia, tâmaras, bolachas simples ou papa fina.</li><li><b>Depois do treino:</b> ovos, peixe, frango ou leite com pão, arroz ou xima.</li><li><b>Almoço:</b> arroz ou xima, 150 g de frango ou peixe, feijão e legumes.</li><li><b>Lanche:</b> iogurte, aveia, banana e 1 colher de pasta de amendoim.</li><li><b>Jantar:</b> batata-doce ou arroz, 150 g de peixe ou carne, salada com abacate.</li><li><b>Antes de dormir:</b> iogurte, leite ou 2 ovos cozidos.</li></ul><h2>Proteína aproximada</h2><ul><li>1 ovo: 6 g</li><li>100 g de frango: 25 a 30 g</li><li>100 g de peixe: 20 a 25 g</li><li>100 g de feijão cozido: 7 a 9 g</li><li>1 copo de leite: 8 g</li><li>2 colheres de pasta de amendoim: 7 g e cerca de 190 kcal</li></ul><div class="note">Evite fritos, gordura e porções grandes antes de treinar. Beba água ao acordar.</div>'}
function seg(){return '<h2>Antes de cada treino</h2><ul><li>Procure rachaduras nos discos, nas pontas dos halteres e na barra.</li><li>Confirme que os discos estão travados e com carga igual dos dois lados.</li><li>Disco com fenda que atravessa a peça deve ser trocado, não remendado.</li><li>Verifique se o banco e o suporte da barra estão firmes.</li></ul><h2>Durante o treino</h2><ul><li>No supino e desenvolvimento, pare sempre com 1 a 2 repetições de reserva.</li><li>Sem ajudante, use apoios de segurança na altura certa.</li><li>Desça sempre com controlo (3 segundos).</li><li>Descanse 2 min nos exercícios pesados e 1 a 1,5 min nos de isolamento.</li></ul><h2>Pesos de cimento</h2><ul><li>Pese cada peça e escreva o peso nela.</li><li>Aguarde 14 dias de cura antes de usar uma peça nova, e 28 para cargas altas.</li></ul>'}
function draw(){
 nav();
 document.getElementById("app").innerHTML=tab=="t"?treino():tab=="c"?comer():seg();
 if(typeof prog=="function")prog();
}
document.addEventListener("click",function(ev){
 var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;draw();window.scrollTo(0,0);}
 else if(b.dataset.d){day=+b.dataset.d;draw();}
 else if(b.dataset.go){startSet(b.dataset.go,b.dataset.k,+b.dataset.m,b.dataset.u)}
 else if(b.dataset.c){DAYS[day][2].forEach(function(e){var b0="s:"+iso+":"+day+":"+e[0];st(b0,"0");st(b0+":E","0");st(b0+":D","0")});draw();}
 else if(b.dataset.n){
  var id=b.dataset.s,n=+b.dataset.n,cur=parseInt(st("s:"+id)||"0",10);
  var v=cur>=n?n-1:n;st("s:"+id,String(v));
  b.parentNode.querySelectorAll("button").forEach(function(x){x.classList.toggle("done",+x.dataset.n<=v)});prog();
 }
});
document.addEventListener("input",function(ev){var i=ev.target;if(i.dataset&&i.dataset.w)st("w:"+i.dataset.w,i.value);if(i.dataset&&i.dataset.rp)st("r:"+i.dataset.rp,i.value);if(i.dataset&&i.dataset.sp)st("q:"+i.dataset.sp,i.value)});
var rest=parseInt(st("tt")||"90",10),left=rest,tm=null,running=false,paused=false,fin=false,mode="rest",lab="Descanso",cur=null,auto=st("au")!=="0",snd=st("so")!=="0",ac=null;
function beep(f,d){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function show(){var c=document.getElementById("clk"),b=document.getElementById("bar");c.textContent=fin?"Pronto!":Math.floor(left/60)+":"+("0"+left%60).slice(-2);document.getElementById("lb").textContent=lab;b.classList.toggle("warn",running&&left<=10&&left>0&&mode=="rest");b.classList.toggle("end",fin);document.getElementById("go").textContent=running?"Pausar":"Iniciar";document.querySelectorAll("#bar [data-p]").forEach(function(x){x.classList.toggle("on",+x.dataset.p==rest)})}
function stop(){clearInterval(tm);tm=null;running=false}
function run(m,sec,l){stop();paused=false;mode=m;left=sec;lab=l;fin=false;running=true;tm=setInterval(tick,1000);show()}
function doRest(){run("rest",rest,"Descanso")}
function markDone(){if(!cur)return;var v=Math.min(cur.m,parseInt(st("s:"+cur.id)||"0",10)+1);st("s:"+cur.id,String(v));document.querySelectorAll('[data-s="'+cur.id+'"]').forEach(function(x){x.classList.toggle("done",+x.dataset.n<=v)});prog()}
function endAll(l){stop();fin=true;lab=l;beep(660,.7);vib([400,150,400,150,400]);show()}
function tick(){
 if(left>0)left--;
 if(mode=="rest"){if(left>0&&left<=5)beep(880,.12);if(left<=0)endAll("Descanso terminou")}
 else if(mode=="prep"){if(left>0&&left<=3)beep(880,.12);if(left<=0){beep(1000,.3);vib(200);mode="set";left=cur.tot;lab=cur.lab(1)}}
 else{var el=cur.tot-left;if(cur.reps>1&&left>0&&el%cur.per==0){beep(900,.08);lab=cur.lab(el/cur.per+1)}if(left<=0){markDone();var sw=false;
  if(cur.uni){var o=cur.side=="E"?"D":"E",a1=parseInt(st("s:"+cur.base+":"+cur.side)||"0",10),b1=parseInt(st("s:"+cur.base+":"+o)||"0",10);
   if(a1>b1&&b1<cur.m){sw=true;cur=mkCur(cur.base,cur.k,cur.m,true,cur.unit,o,cur.reps,cur.per);beep(660,.3);vib(300);run("prep",10,"Troque de "+cur.unit+": agora "+(o=="E"?"esquerda":"direita"))}}
  if(!sw){if(auto){beep(660,.3);vib(300);doRest()}else endAll("Série concluída")}}}
 show()}
function mkCur(base,k,m,uni,unit,side,r,q){var id=uni?base+":"+side:base,d=parseInt(st("s:"+id)||"0",10);return {base:base,id:id,k:k,m:m,uni:uni,unit:unit,side:side,reps:r,per:q,tot:r*q,n:d+1,lab:function(n){return "Série "+this.n+"/"+this.m+(this.uni?" · "+this.unit+" "+(this.side=="E"?"esquerda":"direita"):"")+(this.reps>1?" · rep "+n+"/"+this.reps:" · segure")}}}
function startSet(id,k,m,unit){
 var r=Math.max(1,parseInt((document.querySelector('[data-rp="'+k+'"]')||{}).value,10)||8),q=Math.max(1,parseInt((document.querySelector('[data-sp="'+k+'"]')||{}).value,10)||4),uni=!!unit,side="";
 if(uni){var dE=parseInt(st("s:"+id+":E")||"0",10),dD=parseInt(st("s:"+id+":D")||"0",10);side=dE>dD?"D":"E";if((side=="E"?dE:dD)>=m)side=side=="E"?"D":"E";if((side=="E"?dE:dD)>=m){stop();lab="Todas as séries feitas";show();return}}
 else if(parseInt(st("s:"+id)||"0",10)>=m){stop();lab="Todas as séries feitas";show();return}
 cur=mkCur(id,k,m,uni,unit,side,r,q);
 beep(1000,.12);run("prep",5,"Prepare-se"+(uni?": "+unit+" "+(side=="E"?"esquerda":"direita"):""))}
function tg(){document.getElementById("au").textContent="Descanso auto: "+(auto?"sim":"não");document.getElementById("so").textContent="Som: "+(snd?"sim":"não")}
function prog(){var D=DAYS[day][2],t=0,d=0;D.forEach(function(e){var b0="s:"+iso+":"+day+":"+e[0];if(e[4]){t+=2*e[2];d+=Math.min(e[2],parseInt(st(b0+":E")||"0",10))+Math.min(e[2],parseInt(st(b0+":D")||"0",10))}else{t+=e[2];d+=Math.min(e[2],parseInt(st(b0)||"0",10))}});var el=document.getElementById("prog");if(!el||!t)return;el.innerHTML='<div class="pb"><i style="width:'+Math.round(100*d/t)+'%"></i></div><p class="sub">Séries feitas: '+d+' de '+t+(d==t?'. Treino concluído! Coma proteína e descanse.':'')+'</p>'}
document.getElementById("bar").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.p){rest=+b.dataset.p;st("tt",String(rest));if(!running&&mode=="rest"){left=rest;fin=false;lab="Descanso"}show()}
 else if(b.dataset.a){var n=+b.dataset.a;if(running&&mode=="rest")left=Math.max(1,left+n);else{rest=Math.max(5,rest+n);st("tt",String(rest));if(!running&&mode=="rest"){left=rest;fin=false;lab="Descanso"}}show()}
 else if(b.id=="go"){if(running){stop();paused=true;show()}else if(paused&&!fin&&left>0){paused=false;running=true;tm=setInterval(tick,1000);show()}else{doRest();beep(1000,.15);vib(120)}}
 else if(b.id=="rs"){stop();paused=false;cur=null;mode="rest";left=rest;fin=false;lab="Descanso";show()}
 else if(b.id=="au"){auto=!auto;st("au",auto?"1":"0");tg()}
 else if(b.id=="so"){snd=!snd;st("so",snd?"1":"0");tg();if(snd)beep(700,.1)}});
tg();show();prog();
draw();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
