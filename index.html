function treino(){
 W=week();
 var h='<div class="days">';
 for(var d=1;d<=5;d++)h+='<button data-d="'+d+'" class="'+(day==d?"on":"")+'">'+DAYS[d][0].slice(0,3)+(d==dow?' •':'')+'</button>';

 h+='<details class="card" open><summary>Antes de começar</summary><ul><li>Lanche leve 15 a 20 min antes (banana, pão com açúcar ou leite).</li><li>Corrida leve de 10 min.</li><li>Mobilidade de 2 min: '+(day==1||day==4?'círculos de braços e abertura de peito.':'agachamento livre e círculos de quadril.')+'</li><li>1 a 2 séries leves do primeiro exercício.</li><li>Confira rachaduras e se os discos estão travados.</li></ul></details>';
 D[2].forEach(function(e,ix){
  var k=e[0],p=P[k],x=X[k],id=iso+":"+day+":"+k;
  var saved=parseInt(st("s:"+id)||"0",10);
  var w=st("w:"+k)||"";
  var u=e[4]||"",pr=PRG[day+":"+k],cw=pr?calc(pr,W):null,ld=cw?cw.load:e[1],rt=cw?(cw.reps+(pr.unit=="s"?" s":"")+(pr.sfx||"")):e[3];
  h+='<section class="card" data-id="'+id+'"><h3><span class="ix">'+(ix+1)+'</span>'+x[0]+'</h3><div class="chips"><span>'+ld+'</span><span class="a">'+e[2]+' x '+rt+(u?' por '+u:'')+'</span></div>'+(cw?'<p class="nx">'+hint(pr,W)+'</p>':'');
  var sd=u?[["E","esquerda",parseInt(st("s:"+id+":E")||"0",10)],["D","direita",parseInt(st("s:"+id+":D")||"0",10)]]:[["","",saved]];
  sd.forEach(function(q){
   if(u)h+='<div class="sl">'+u.charAt(0).toUpperCase()+u.slice(1)+' '+q[1]+'</div>';
   h+='<div class="sets">';
   for(var i=1;i<=e[2];i++)h+='<button data-s="'+id+(q[0]?":"+q[0]:"")+'" data-n="'+i+'" class="'+(q[2]>=i?"done":"")+'" aria-label="Série '+i+(q[1]?' '+q[1]:'')+'">'+i+'</button>';
   h+='</div>';
  });

  var tb=/ s$/.test(String(e[3])),nm=(String(e[3]).match(/\d+/)||["8"])[0],rv=st("r:"+k+":"+W)||(tb?"1":(cw?String(cw.reps):nm)),pv=st("q:"+k+":"+W)||(tb?(cw?String(cw.reps):"45"):"4");
  h+='<div class="cfg"><label>Reps <input class="n" inputmode="numeric" data-rp="'+k+'" value="'+esc(rv)+'"></label><label>Seg. por rep <input class="n" inputmode="numeric" data-sp="'+k+'" value="'+esc(pv)+'"></label></div><button class="cta" data-go="'+id+'" data-k="'+k+'" data-m="'+e[2]+'" data-u="'+u+'">▶ Iniciar série ('+(u?Math.min(2*e[2],sd[0][2]+sd[1][2]+1)+'/'+2*e[2]:(saved>=e[2]?e[2]:saved+1)+'/'+e[2])+')</button>';
  h+='<details><summary>Ver execução e efeito no corpo</summary><div class="pair"><figure>'+svg(p[0])+'<figcaption>'+(p[1]?"Início":"Posição")+'</figcaption></figure>'+(p[1]?'<figure>'+svg(p[1])+'<figcaption>Fim</figcaption></figure>':'')+'</div><p class="cue">'+x[1]+'</p><p class="cue"><b>Efeito no corpo:</b> '+EF[k]+'</p><p class="cue"><a href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(x[0]+' execução correta')+'" target="_blank" rel="noopener">Ver fotos reais</a> · <a href="https://www.youtube.com/results?search_query='+encodeURIComponent(x[0]+' execução correta')+'" target="_blank" rel="noopener">Ver vídeo</a></p></details></section>';
 });
 h+='<button class="clr" data-c="1">Limpar séries de hoje</button>';h+='<div class="note">As metas sobem sozinhas a cada semana. Se não conseguir cumprir a meta, use a seta para voltar uma semana. Pare sempre com 1 a 2 repetições de reserva.</div>';

function comer(){return '<h2>Metas diárias</h2><ul><li>Proteína: 120 a 160 g por dia, em 30 a 40 g por refeição.</li><li>Calorias: 250 a 300 kcal acima da manutenção.</li><li>Ganho realista: 0,25 a 0,5 kg por mês. Pese-se uma vez por semana.</li></ul><h2>Ao longo do dia</h2><ul><li><b>Antes do treino:</b> banana, pão com açúcar ou mel, ou leite. Se não tiver, manga, papaia, tâmaras, bolachas simples ou papa fina.</li><li><b>Depois do treino:</b> ovos, peixe, frango ou leite com pão, arroz ou xima.</li><li><b>Almoço:</b> arroz ou xima, 150 g de frango ou peixe, feijão e legumes.</li><li><b>Lanche:</b> iogurte, aveia, banana e 1 colher de pasta de amendoim.</li><li><b>Jantar:</b> batata-doce ou arroz, 150 g de peixe ou carne, salada com abacate.</li><li><b>Antes de dormir:</b> iogurte, leite ou 2 ovos cozidos.</li></ul><h2>Proteína aproximada</h2><ul><li>1 ovo: 6 g</li><li>100 g de frango: 25 a 30 g</li><li>100 g de peixe: 20 a 25 g</li><li>100 g de feijão cozido: 7 a 9 g</li><li>1 copo de leite: 8 g</li><li>2 colheres de pasta de amendoim: 7 g e cerca de 190 kcal</li></ul><div class="note">Evite fritos, gordura e porções grandes antes de treinar. Beba água ao acordar.</div>'}

document.addEventListener("click",function(ev){

var rest=parseInt(st("tt")||"90",10),left=rest,tm=null,running=false,paused=false,fin=false,mode="rest",lab="Descanso",cur=null,auto=st("au")!=="0",snd=st("so")!=="0",ac=null;

 else if(mode=="prep"){if(left>0&&left<=3)beep(880,.12);if(left<=0){beep(1000,.3);vib(200);mode="set";left=cur.tot;lab=cur.lab(1)}}

 var n=Math.ceil(t/2),dx=Math.min(11,110/n),o='<svg class="plates" viewBox="0 0 300 70" role="img" aria-label="'+d+' de '+t+' séries feitas"><line class="bar" x1="12" y1="35" x2="288" y2="35"/>';

document.getElementById("bar").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
